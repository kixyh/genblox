<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genblox - Roblox Username Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #121212;
      color: #fff;
    }
    h1 { color: #00e676; text-align: center; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    button {
      background: #00e676;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #00c853; }
    textarea {
      width: 100%;
      height: 150px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>Genblox</h1>
  <p>Generate clean username ideas and copy them all at once.</p>

  <div class="controls">
    <button onclick="generateUsernames()">Generate Names</button>
    <button onclick="copyAll()">Copy All Names</button>
  </div>

  <textarea id="outputBox" placeholder="Your generated usernames will appear here..." readonly></textarea>

  <script>
    const prefixes = ["Neo", "Pixel", "Vortex", "Shadow", "Blaze", "Frost", "Cyber", "Echo"];
    const suffixes = ["Craft", "Byte", "Striker", "Pulse", "Storm", "Wave", "X", "Knight"];

    function generateUsernames() {
      const results = [];
      for (let i = 0; i < 10; i++) {
        const pref = prefixes[Math.floor(Math.random() * prefixes.length)];
        const suff = suffixes[Math.floor(Math.random() * suffixes.length)];
        const num = Math.floor(Math.random() * 899) + 100;
        results.push(`${pref}${suff}_${num}`);
      }
      document.getElementById("outputBox").value = results.join("\n");
    }

    function copyAll() {
      const box = document.getElementById("outputBox");
      if (!box.value) return;
      box.select();
      navigator.clipboard.writeText(box.value);
      alert("All usernames copied to clipboard!");
    }
  </script>
</body>
</html>
